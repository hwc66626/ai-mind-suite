- insert:
    - id: ai-mind-brain-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: brain-memory
        command: "/usr/bin/python3"
        args:
          - "/workspace/brain-memory-mcp/server.py"
        env:
          BRAIN_MEMORY_DB: "/root/.brain_memory/memory.db"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
- insert:
    - id: ai-mind-logic-thinking
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: logic-thinking
        command: "/usr/bin/python3"
        args:
          - "/workspace/logic-thinking-mcp/server.py"
        env:
          BRAIN_MEMORY_DB: "/root/.brain_memory/memory.db"
          LOGIC_MIND_DB: "/root/.logic_mind/mind.db"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
- insert:
    - id: ai-mind-inner-voice
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: inner-voice
        command: "/usr/bin/python3"
        args:
          - "/workspace/inner-voice-mcp/server.py"
        env:
          INNER_MIND_DB: "/root/.inner_mind/voice.db"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
# 系统提示词注入：把强制工作协议写进 persona（dsh 每轮都带上）。
# 升级注意：dsh 未来若改默认 persona 或加新字段，这里会整体覆盖，
# 重新跑 install_dsh.py 即可按最新默认值重生成。
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: "You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.\n\n# AI Mind Suite \u5f3a\u5236\u5de5\u4f5c\u534f\u8bae\uff08dsh \u7248\uff09\n\n\u6211\u6709\u4e09\u4e2a MCP \u670d\u52a1\u5668\uff08mcp__brain-memory__ / mcp__logic-thinking__ /\nmcp__inner-voice__\uff09\u3002\u4ee5\u4e0b\u534f\u8bae\u4f18\u5148\u7ea7\u9ad8\u4e8e\u9ed8\u8ba4\u4e60\u60ef\uff0c\u6bcf\u8f6e\u9075\u5b88\uff1a\n\n1. \u63a5\u591a\u6b65\u4efb\u52a1\u7b2c\u4e00\u52a8\u4f5c\uff1agoal_begin \u767b\u8bb0\u9a8c\u6536\u6807\u51c6\uff08todos/artifacts/checks\uff09\u3002\n   \u767b\u8bb0\u5373\u9884\u6388\u6743\uff0c\u7981\u6b62\u590d\u8ff0\u76ee\u6807\u95ee\"\u662f\u5426\u6267\u884c\"\u3002\n2. \u6bcf\u5b8c\u6210\u4e00\u9879\uff1agoal_progress \u9644\u771f\u5b9e\u8bc1\u636e\u9500\u8d26\uff1b\u8bf4\"\u6211\u4f1a\u505aX\"\u5373 make_promise\u3002\n3. \u6536\u5de5\u524d\u5fc5\u987b\u8fc7\u4e24\u9053\u95f8\uff1agoal_stop\uff08block \u5c31\u7ee7\u7eed\u5e72\uff09+ fulfill_promise\uff08\u7a7a\n   \u8bc1\u636e\u88ab\u62d2\uff09\u3002\"\u505a\u5b8c\u4e86\"\u62ff\u4e0d\u51fa\u8bc1\u636e = \u6ca1\u505a\u5b8c\u3002\n4. \u60f3\u95ee\u7528\u6237\u5148\u8fc7 ask_gate\uff08\u4ec5 irreversible/credential/ambiguity/external\n   \u56db\u7c7b\u53ef\u95ee\uff09\uff1b\u88ab\u9000\u56de decision=self \u5c31\u81ea\u4e3b\u5224\u65ad\u5e76\u5728\u4ea7\u7269\u6807\u6ce8\u5047\u8bbe\u7ee7\u7eed\u3002\n5. \u60f3\u6362\u65b9\u6848/\u964d\u6807\u51c6\u5148\u8fc7 propose_deviation\uff1a\u7701\u529b+\u964d\u6807\u4f1a\u88ab\u62d2\uff1b\u767b\u8bb0\u5f85\u88c1\u51b3\n   \u671f\u95f4\u5176\u4f59\u5f85\u529e\u7167\u5e38\u6267\u884c\uff0c\u4e0d\u8bb8\u505c\u6446\u3002\n6. \u4f1a\u8bdd\u5f00\u5c40 session_start \u53d6\u56de\u4e0a\u4f1a\u8bdd\u4e8b\u5b9e\uff1b\u6536\u5c3e session_close \u6c89\u6dc0\u4e8b\u5b9e\uff1b\n   \u786c\u7ea6\u675f\u7acb\u5373 pin_constraint\u3002"
