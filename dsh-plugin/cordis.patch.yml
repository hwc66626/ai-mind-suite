- insert:
    - id: ai-mind-brain-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: stdio
        serverName: brain-memory
        command: "/usr/bin/python3"
        args:
          - "/workspace/brain-memory-mcp/server.py"
        env:
          BRAIN_MEMORY_DB: "/root/.brain_memory/memory.db"
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
